<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fantino Quaternius — banco di prova</title>
<style>
  html,body{margin:0;height:100%;background:#cbb994;overflow:hidden;font-family:system-ui}
  #info{position:fixed;top:8px;left:8px;background:#0009;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;white-space:pre;z-index:9;max-width:46vw}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="info">carico…</div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.165.0/examples/jsm/loaders/GLTFLoader.js";

const qp = new URLSearchParams(location.search);
const NUDE = qp.get("nude") === "1";          // ?nude=1 → niente vestiti, solo corpo posato
const RAW  = qp.get("raw") === "1";           // ?raw=1  → nessuna posa (bind pose)
const SHOWHORSE = qp.get("horse") === "1";    // ?horse=1 → mostra anche il cavallo (check seduta)

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcbb994);
const camera = new THREE.PerspectiveCamera(38, innerWidth/innerHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b4a2a, 1.15));
const sun = new THREE.DirectionalLight(0xfff2d0, 1.7); sun.position.set(3,6,4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(5,48), new THREE.MeshStandardMaterial({color:0xcaa96f}));
floor.rotation.x = -Math.PI/2; scene.add(floor);

// ── Colori Leocorno (test): principale bianco, secondario arancio, liste azzurre.
const COLS = { primario:"#f2ead6", secondario:"#e8722a", liste:"#1E7BC4", casco1:"#e8722a", casco2:"#f2ead6" };

// ══ VESTIZIONE: costruisce giubbetto/maniche/pantaloni/zucchino/nerbo sui GIUNTI del
// corpo posato (spazio LOCALE del pivot). cols = {primario, secondario, liste}.
// H = altezza modello (unità locali) per dimensionare i raggi. Tutto figlio del pivot.
function buildOutfit(pivot, model, cols, H) {
  pivot.updateMatrixWorld(true);
  const std = new THREE.MeshStandardMaterial();
  const mat = (c) => { const m = std.clone(); m.color = new THREE.Color(c); m.roughness = 0.55; m.metalness = 0.03; return m; };
  const grp = new THREE.Group(); pivot.add(grp);
  const bones = {};
  model.traverse((o) => { if (o.isBone) bones[o.name] = o; });
  const wp = (n) => { const b = bones[n]; if (!b) return null; const v = new THREE.Vector3(); b.getWorldPosition(v); return pivot.worldToLocal(v); };
  const midpoint = (a, b) => a.clone().add(b).multiplyScalar(0.5);
  // Tubo conico fra due punti locali (a→b), raggi rA(base)→rB(cima). Cilindro lungo +Y.
  const tube = (a, b, rA, rB, m, stretch) => {
    if (!a || !b) return null;
    const dir = new THREE.Vector3().subVectors(b, a); const len = dir.length() * (stretch || 1);
    const g = new THREE.CylinderGeometry(rB, rA, len, 14); const mesh = new THREE.Mesh(g, m);
    mesh.position.copy(midpoint(a, b));
    mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
    grp.add(mesh); return mesh;
  };
  const ballAt = (p, r, m) => { if (!p) return; const s = new THREE.Mesh(new THREE.SphereGeometry(r, 16, 12), m); s.position.copy(p); grp.add(s); };

  const primario = mat(cols.primario), secondario = mat(cols.secondario), liste = mat(cols.liste);
  // giunti
  const pelvis = wp("pelvis"), spine2 = wp("spine_02"), spine3 = wp("spine_03"), neck = wp("neck_01"), head = wp("Head");
  const clavL = wp("clavicle_l"), clavR = wp("clavicle_r");
  const upLegL = wp("thigh_l"), upLegR = wp("thigh_r"), kneeL = wp("calf_l"), kneeR = wp("calf_r"), ankL = wp("foot_l"), ankR = wp("foot_r");
  const shL = wp("upperarm_l"), shR = wp("upperarm_r"), elbL = wp("lowerarm_l"), elbR = wp("lowerarm_r"), handL = wp("hand_l"), handR = wp("hand_r");

  // ── PANTALONI (secondario) + risvolto liste alla caviglia ──
  tube(upLegL, kneeL, 0.075 * H, 0.058 * H, secondario, 1.06);
  tube(upLegR, kneeR, 0.075 * H, 0.058 * H, secondario, 1.06);
  tube(kneeL, ankL, 0.055 * H, 0.042 * H, secondario, 1.05);
  tube(kneeR, ankR, 0.055 * H, 0.042 * H, secondario, 1.05);
  ballAt(ankL, 0.045 * H, liste); ballAt(ankR, 0.045 * H, liste);   // risvolto/caviglia
  ballAt(ankL && ankL.clone().add(new THREE.Vector3(0, -0.03 * H, 0.03 * H)), 0.05 * H, mat("#20160e"));  // scarpa scura
  ballAt(ankR && ankR.clone().add(new THREE.Vector3(0, -0.03 * H, 0.03 * H)), 0.05 * H, mat("#20160e"));

  // ── GIUBBETTO (torso): principale, con pannello frontale secondario + collo liste ──
  if (spine3 && pelvis) {
    const top = midpoint(clavL || spine3, clavR || spine3);
    const torso = tube(pelvis, top, 0.15 * H, 0.135 * H, primario, 1.14);  // busto principale
    if (torso) torso.scale.set(1.28, 1, 0.82);                     // spalle larghe, meno profondo (non un tubo)
    ballAt(top, 0.085 * H, liste);                                  // collo/liste
    // ── STEMMA sulla schiena (placeholder ovale: bordo liste + campo secondario) ──
    const back = midpoint(pelvis, top).add(new THREE.Vector3(0, 0.05 * H, -0.135 * H));
    const disc = new THREE.Mesh(new THREE.CircleGeometry(0.12 * H, 24), liste);
    disc.position.copy(back); disc.rotation.y = Math.PI; grp.add(disc);
    const disc2 = new THREE.Mesh(new THREE.CircleGeometry(0.095 * H, 24), mat("#f2ead6"));
    disc2.position.copy(back.clone().add(new THREE.Vector3(0, 0, -0.001 * H))); disc2.rotation.y = Math.PI; grp.add(disc2);
  }

  // ── MANICHE (secondario) ──
  tube(shL, elbL, 0.05 * H, 0.042 * H, secondario, 1.05);
  tube(shR, elbR, 0.05 * H, 0.042 * H, secondario, 1.05);
  tube(elbL, handL, 0.042 * H, 0.034 * H, secondario, 1.05);
  tube(elbR, handR, 0.042 * H, 0.034 * H, secondario, 1.05);

  // ── ZUCCHINO a calotta (principale) con lista (liste) ──
  if (head) {
    const zg = new THREE.Group(); grp.add(zg); zg.position.copy(head.clone().add(new THREE.Vector3(0, 0.02 * H, 0)));
    const dome = new THREE.Mesh(new THREE.SphereGeometry(0.115 * H, 20, 14, 0, TAU, 0, Math.PI * 0.62), primario);
    dome.scale.set(1, 1.02, 1.05); zg.add(dome);
    const stripe = new THREE.Mesh(new THREE.BoxGeometry(0.03 * H, 0.02 * H, 0.24 * H), secondario);
    stripe.position.y = 0.02 * H; zg.add(stripe);
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.112 * H, 0.012 * H, 8, 22), liste);
    band.rotation.x = Math.PI / 2; band.position.y = -0.01 * H; zg.add(band);
  }

  // ── NERBO in mano destra (frusta chiara) ──
  if (handR) {
    const nerbo = new THREE.Mesh(new THREE.CylinderGeometry(0.006 * H, 0.009 * H, 0.5 * H, 7), mat("#d8c7a2"));
    nerbo.position.copy(handR.clone().add(new THREE.Vector3(0, -0.16 * H, 0.05 * H)));
    nerbo.rotation.x = 0.5; grp.add(nerbo);
  }
  return grp;
}
const TAU = Math.PI * 2;

// ── POSA (ossa stile Unreal). Euler [x,y,z] in radianti = OFFSET sulla bind pose
// (NON sostituzione: azzerare un osso distrugge la posa a riposo). Posa SEDUTA di default.
const POSE = {
  thigh_l:[0.82,0,0.16], thigh_r:[0.82,0,-0.16],   // cosce avanti + un filo aperte (a cavalcioni)
  calf_l:[-0.98,0,0],    calf_r:[-0.98,0,0],        // ginocchia piegate
  spine_02:[0.12,0,0],                              // busto un filo in avanti
  upperarm_l:[0.5,0,-1.2], upperarm_r:[0.5,0,1.2],  // braccia giù+avanti (redini)
  lowerarm_l:[0,0,-0.55],  lowerarm_r:[0,0,0.55],   // gomito piegato
};
// Override posa da URL: ?p=thigh_l:1,0,0;calf_l:-1,0,0  (radianti)
const pParam = qp.get("p");
if (pParam) pParam.split(";").forEach(seg=>{
  const [bone,vals] = seg.split(":"); if(!bone||!vals) return;
  const a = vals.split(",").map(Number); POSE[bone.trim()] = [a[0]||0,a[1]||0,a[2]||0];
});

let horseBackY = 1.2, seatFn = null;
// CAVALLO (riferimento seduta) — solo se ?horse=1
if (SHOWHORSE) new GLTFLoader().load("./assets/horses/horse_master.glb", (g)=>{
  const h=g.scene;
  const box0=new THREE.Box3().setFromObject(h); const sz=box0.getSize(new THREE.Vector3());
  const scala=(1.7/Math.max(1,sz.y))*2;
  const piv=new THREE.Group(); piv.scale.setScalar(scala); piv.add(h);
  piv.updateMatrixWorld(true);
  const bb=new THREE.Box3().setFromObject(piv); const c=bb.getCenter(new THREE.Vector3());
  piv.position.set(-c.x, -bb.min.y, -c.z);
  h.traverse(o=>{ if(o.isMesh){ o.material=o.material.clone(); o.material.metalness=0; o.material.roughness=0.9; if(o.material.color) o.material.color.set("#3a2a1c"); }});
  scene.add(piv);
  horseBackY = (bb.max.y - bb.min.y) * 0.52;
  if (seatFn) seatFn();
});

new GLTFLoader().load("./assets/jockeys/quaternius/Superhero_Male_FullBody.gltf", (gltf)=>{
  const model = gltf.scene;
  // scala + framing calcolati sulla BIND pose (stabili al variare della posa)
  const pivot = new THREE.Group();
  pivot.add(model);
  const box = new THREE.Box3().setFromObject(pivot);
  const size = box.getSize(new THREE.Vector3());
  const scala = 1.75 / Math.max(0.1, size.y);
  pivot.scale.setScalar(scala);
  pivot.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(pivot);
  const c = bb.getCenter(new THREE.Vector3());
  // POSA come OFFSET sulla bind pose: q = q_bind * q_offset. Frame fissato sopra.
  if(!RAW){
    model.traverse(o=>{
      if(o.isBone && POSE[o.name]){
        const p = POSE[o.name];
        const off = new THREE.Quaternion().setFromEuler(new THREE.Euler(p[0],p[1],p[2]));
        o.quaternion.multiply(off);
      }
    });
  }
  // Da solo: piedi a terra, centrato. Con cavallo: seduto sul dorso.
  seatFn = () => SHOWHORSE
    ? pivot.position.set(-c.x, -bb.min.y + horseBackY - 0.15, -c.z + 0.15)
    : pivot.position.set(-c.x, -bb.min.y, -c.z);
  seatFn();
  scene.add(pivot);
  if (!NUDE) { try { buildOutfit(pivot, model, COLS, size.y); } catch(e){ console.warn("outfit:", e); } }
  window._model = model; window._pivot = pivot;

  const bones=[]; model.traverse(o=>{ if(o.isBone) bones.push(o.name); });
  document.getElementById("info").textContent =
    "Quaternius SuperHero_Male\nscala:"+scala.toFixed(3)+"  size.y:"+size.y.toFixed(2)
    +"\nposa:"+(RAW?"BIND (raw)":"seduta")+(NUDE?"  [nudo]":"")
    +"\nmateriali/ossa caricati ("+bones.length+" ossa)";
}, undefined, (e)=>{ document.getElementById("info").textContent = "ERRORE fantino: "+(e&&e.message); });

const angParam = qp.get("ang");
let t = angParam !== null ? (parseFloat(angParam)*Math.PI/180) : Math.PI*0.5;
function loop(){
  if (angParam === null) t += 0.004;
  const r = SHOWHORSE ? 5.2 : 4.6;
  const camY = SHOWHORSE ? 2.1 : 1.2;
  const lookY = SHOWHORSE ? 1.35 : 1.0;
  camera.position.set(Math.sin(t)*r, camY, Math.cos(t)*r);
  camera.lookAt(0,lookY,0);
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
loop();
addEventListener("resize",()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
</script>
</body>
</html>
